<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="manifest.json" />
  <title id="app-title">Only Move</title>
  <link rel="stylesheet" type="text/css" href="lib/wgo/wgo.player.css" />
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <!-- New main container for Flexbox layout -->
  <div id="main-container">
    <div id="title-container">
      <div id="title" class="info-text">Title</div>
      <div id="captures-container" class="captures-container">
        <div id="capture-score" class="capture-score" role="button" tabindex="0">0.0</div>
      </div>
      <div id="text1" class="info-text">Rank</div>
    </div>
    
    <div id="board-container"></div>

    <!-- New wrapper for control panels -->
    <div id="controls-wrapper">
      <div id="info-container">
        <div id="title-h" class="info-text horizontal-only">Title</div>
        <div id="captures-container-h" class="captures-container horizontal-only">
          <div id="capture-score-h" class="capture-score" role="button" tabindex="0">0.0</div>
        </div>
        <div id="text1-h" class="info-text horizontal-only">Rank</div>
        <a href="#" id="button1" class="btn"></a>
        <a href="#" id="button2" class="btn"></a>
        <a href="#" id="button3" class="btn"></a>
      </div>
    </div>
  </div>

  <script type="text/javascript">
    var WGo = WGo || {};
    WGo.DIR = 'lib/wgo/';
  </script>

  <script type="text/javascript" src="lib/wgo/wgo.min.js"></script>
  <script type="text/javascript" src="lib/wgo/wgo.player.min.js"></script>
  <script type="text/javascript" src="lib/math.min.js"></script>
  <script type="text/javascript" src="lib/jszip.min.js"></script>
  <script type="module" src="js/main.js"></script>
  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').then(registration => {
                console.log('Service Worker registered with scope:', registration.scope);
            }).catch(err => {
                console.error('Service Worker registration failed:', err);
            });
        });
    }
  </script>
  <div id="resume-overlay" class="resume-overlay-hidden">
    <div id="resume-text">Click to continue</div>
  </div>
</body>
</html>
