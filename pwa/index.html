<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Yose Tsumego">
    <link rel="manifest" href="/manifest.json">
    <title>Yose Tsumego</title>
    <link rel="stylesheet" type="text/css" href="wgo.js/wgo/wgo.player.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            touch-action: manipulation; /* Prevents double-tap zoom */
        }

        /* Light mode default */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 0;
            /* Prevent text selection which can interfere with touch actions */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            /* Prevent zoom on focus */
            font-size: 16px;
            background-color: #ffffff; /* Light background */
            color: #000000; /* Dark text */
        }

        /* Dark mode */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #121212; /* Dark background */
                color: #ffffff; /* Light text */
            }
        }

        #board-container {
            width: 100vw;
            height: 100vw;
            max-width: none;
            max-height: none;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Prevent zoom on double tap */
            touch-action: manipulation;
            position: relative;
        }

        /* Remove borders from wgo board to eliminate 1px gap at top */
        .wgo-board {
            margin: 0 !important;
            border-top: none !important;
            border-right: none !important;
            border-left: none !important;
            border-bottom: none !important;
        }

        #controls {
            margin-top: 20px;
        }

        #rank-controls {
            margin-top: 10px;
        }

        #rank-controls button {
            margin: 2px;
            padding: 5px 10px;
        }

        @media (orientation: landscape) {
            body {
                flex-direction: row;
                align-items: flex-start;
                height: 100vh;
                overflow: hidden;
            }

            #board-container {
                width: 100vh;
                height: 100vh;
                max-width: 100vh;
                max-height: 100vh;
            }

            #controls {
                margin-top: 0;
                margin-left: 20px;
                max-height: 100vh;
                overflow-y: auto;
            }
        }

        @media (max-width: 400px) {
            #board-container {
                width: 100vw;
                height: 100vw;
            }
        }

        /* Ensure board takes full width on vertical screens */
        @media (orientation: portrait) {
            #board-container {
                width: 100vw;
                height: 100vw;
                max-width: 100vw;
                max-height: 100vw;
            }
        }
        
        /* Disable all forms of zooming */
        * {
            touch-action: manipulation;
            -ms-touch-action: manipulation;
        }
    </style>
</head>
<body>
    <div id="board-container"></div>
    <div id="controls">
    </div>

    <script type="text/javascript" src="wgo.js/wgo/wgo.js"></script>
    
    <script type="text/javascript" src="wgo.js/wgo/sgfparser.js"></script>
    <script type="text/javascript" src="wgo.js/wgo/kifu.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="appe2a4824a.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>
