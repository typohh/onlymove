<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover: take the WHOLE screen, cutout and all, rather than the
       safe rectangle the browser would otherwise letterbox us into. That is what
       makes env(safe-area-inset-*) report real values, which style.css subtracts
       into --app-h/--app-w and pays back as body padding — so the shell still
       sits inside the safe area while the fixed full-bleed layers (#corner-art,
       the overlay/modal backdrops) reach the physical corners. Without it those
       layers stop at the browser's letterbox and the insets are all 0px. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <!-- Browser chrome colour follows the page: the app paints #211f1c (style.css --canvas) by default and
       white under a light preference (style.css), and the manifest, which cannot
       switch, takes the default. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#211f1c">
  <meta name="theme-color" content="#211f1c">
  <!-- Standalone hints. `mobile-web-app-capable` is the modern, cross-browser
       key (Chrome/Samsung Internet); the `apple-*` pair is the iOS equivalent.
       These make even a legacy "Add to Home screen" shortcut (the fallback
       Samsung Internet creates on non-Samsung devices, where it can't mint a
       WebAPK) open chrome-less rather than in a framed browser tab. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Only Move">
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title id="app-title">Only Move</title>
  <link rel="stylesheet" type="text/css" href="style.css">
  <!-- Critical, self-contained boot-splash CSS: inlined so the loading state
       paints on the very first frame, before the (deferred, module) JS bundle
       has downloaded/parsed. Shows an animated 5×5 Triple Ko Go board matching
       the app icon, looping the 6-move sequence until loading completes. -->
  <style id="boot-splash-style">
    #boot-splash {
      position: fixed; inset: 0; z-index: 10000;
      display: flex; align-items: center; justify-content: center;
      background: #211f1c;
      transition: opacity 0.35s ease;
    }
    #boot-splash.boot-hidden { opacity: 0; pointer-events: none; }
    .boot-content {
      display: flex; flex-direction: column; align-items: center;
      gap: clamp(14px, 4vmin, 24px);
    }
    .boot-board svg {
      width: clamp(160px, 45vmin, 220px);
      height: clamp(160px, 45vmin, 220px);
      display: block;
      filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.5));
    }
    .boot-loading-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(0.95rem, 3.5vmin, 1.15rem);
      letter-spacing: 0.06em;
      color: #ccc;
      text-align: center;
    }
    .ko-stone {
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes ko-b1 {
      0% { opacity: 0; transform: scale(1.18); }
      1.5% { opacity: 1; transform: scale(1); }
      49.9% { opacity: 1; transform: scale(1); }
      50% { opacity: 0; transform: scale(0.9); }
      100% { opacity: 0; }
    }
    @keyframes ko-c1 {
      0% { opacity: 0; }
      49.9% { opacity: 0; }
      50% { opacity: 0; transform: scale(1.18); }
      51.5% { opacity: 1; transform: scale(1); }
      99.9% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.9); }
    }
    @keyframes ko-b3 {
      0% { opacity: 1; transform: scale(1); }
      16.6% { opacity: 1; transform: scale(1); }
      16.7% { opacity: 0; transform: scale(0.9); }
      66.6% { opacity: 0; }
      66.7% { opacity: 0; transform: scale(1.18); }
      68.2% { opacity: 1; transform: scale(1); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes ko-c3 {
      0% { opacity: 0; }
      16.6% { opacity: 0; }
      16.7% { opacity: 0; transform: scale(1.18); }
      18.2% { opacity: 1; transform: scale(1); }
      66.6% { opacity: 1; transform: scale(1); }
      66.7% { opacity: 0; transform: scale(0.9); }
      100% { opacity: 0; }
    }
    @keyframes ko-b5 {
      0% { opacity: 0; }
      33.3% { opacity: 0; }
      33.4% { opacity: 0; transform: scale(1.18); }
      34.9% { opacity: 1; transform: scale(1); }
      83.3% { opacity: 1; transform: scale(1); }
      83.4% { opacity: 0; transform: scale(0.9); }
      100% { opacity: 0; }
    }
    @keyframes ko-c5 {
      0% { opacity: 1; transform: scale(1); }
      33.3% { opacity: 1; transform: scale(1); }
      33.4% { opacity: 0; transform: scale(0.9); }
      83.3% { opacity: 0; }
      83.4% { opacity: 0; transform: scale(1.18); }
      84.9% { opacity: 1; transform: scale(1); }
      100% { opacity: 1; transform: scale(1); }
    }
    .ko-b1 { animation: ko-b1 3.6s infinite; }
    .ko-c1 { animation: ko-c1 3.6s infinite; }
    .ko-b3 { animation: ko-b3 3.6s infinite; }
    .ko-c3 { animation: ko-c3 3.6s infinite; }
    .ko-b5 { animation: ko-b5 3.6s infinite; }
    .ko-c5 { animation: ko-c5 3.6s infinite; }
    .board-plate { fill: #2c2925; stroke: #454039; stroke-width: 1.5; }
    .board-grid-line { stroke: #6e675e; stroke-width: 1.5; }
    .board-star-dot { fill: #6e675e; }
    @media (prefers-color-scheme: light) {
      #boot-splash { background: #f0f0f0; }
      .boot-board svg { filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.15)); }
      .boot-loading-text { color: #555; }
      .board-plate { fill: #dcb382; stroke: #b58d5f; }
      .board-grid-line { stroke: #7d5930; }
      .board-star-dot { fill: #7d5930; }
    }
  </style>
</head>
<body>
  <!-- Pure-CSS animated 5x5 Triple Ko loading state shown from first paint until the app is ready -->
  <div id="boot-splash">
    <div class="boot-content">
      <div class="boot-board">
        <svg viewBox="0 0 240 240" width="240" height="240" aria-label="Loading animation">
          <defs>
            <radialGradient id="w-grad" cx="35%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="80%" stop-color="#e2e2e2"/>
              <stop offset="100%" stop-color="#c5c5c5"/>
            </radialGradient>
            <radialGradient id="b-grad" cx="35%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#424242"/>
              <stop offset="30%" stop-color="#222222"/>
              <stop offset="100%" stop-color="#0d0d0d"/>
            </radialGradient>
            <circle id="w-stone" r="18" fill="url(#w-grad)" stroke="#999" stroke-width="0.8" />
            <circle id="b-stone" r="18" fill="url(#b-grad)" stroke="#444" stroke-width="0.8" />
          </defs>
          <!-- Background board plate -->
          <rect class="board-plate" x="18" y="18" width="204" height="204" rx="10" />
          <!-- Grid lines -->
          <g class="board-grid-line">
            <line x1="40" y1="40" x2="40" y2="200" />
            <line x1="80" y1="40" x2="80" y2="200" />
            <line x1="120" y1="40" x2="120" y2="200" />
            <line x1="160" y1="40" x2="160" y2="200" />
            <line x1="200" y1="40" x2="200" y2="200" />
            <line x1="40" y1="40" x2="200" y2="40" />
            <line x1="40" y1="80" x2="200" y2="80" />
            <line x1="40" y1="120" x2="200" y2="120" />
            <line x1="40" y1="160" x2="200" y2="160" />
            <line x1="40" y1="200" x2="200" y2="200" />
          </g>
          <!-- Star point at D4 -->
          <circle class="board-star-dot" cx="160" cy="160" r="3.5" />
          <!-- Static White stones (7) -->
          <use href="#w-stone" x="40" y="40" />
          <use href="#w-stone" x="40" y="80" />
          <use href="#w-stone" x="40" y="120" />
          <use href="#w-stone" x="40" y="160" />
          <use href="#w-stone" x="40" y="200" />
          <use href="#w-stone" x="80" y="80" />
          <use href="#w-stone" x="80" y="160" />
          <!-- Static Black stones (11) -->
          <use href="#b-stone" x="120" y="80" />
          <use href="#b-stone" x="120" y="160" />
          <use href="#b-stone" x="160" y="40" />
          <use href="#b-stone" x="160" y="80" />
          <use href="#b-stone" x="160" y="120" />
          <use href="#b-stone" x="160" y="200" />
          <use href="#b-stone" x="200" y="40" />
          <use href="#b-stone" x="200" y="80" />
          <use href="#b-stone" x="200" y="120" />
          <use href="#b-stone" x="200" y="160" />
          <use href="#b-stone" x="200" y="200" />
          <!-- Dynamic Ko stones (6) -->
          <g class="ko-stone ko-b1"><use href="#b-stone" x="80" y="40" /></g>
          <g class="ko-stone ko-c1"><use href="#w-stone" x="120" y="40" /></g>
          <g class="ko-stone ko-b3"><use href="#b-stone" x="80" y="120" /></g>
          <g class="ko-stone ko-c3"><use href="#w-stone" x="120" y="120" /></g>
          <g class="ko-stone ko-b5"><use href="#b-stone" x="80" y="200" /></g>
          <g class="ko-stone ko-c5"><use href="#w-stone" x="120" y="200" /></g>
        </svg>
      </div>
      <div id="boot-loading-text" class="boot-loading-text">Loading…</div>
    </div>
  </div>
  <script>
    (function () {
      var l = (navigator.language || 'en').toLowerCase();
      var msg = 'Loading…';
      if (l.startsWith('ja')) msg = '読み込み中…';
      else if (l.startsWith('zh')) msg = '正在加载…';
      else if (l.startsWith('ko')) msg = '로딩 중…';
      var el = document.getElementById('boot-loading-text');
      if (el) el.textContent = msg;
    })();
  </script>
  <!-- Decorative monochrome ink-wash corner art; purely cosmetic, sits behind all UI. -->
  <div id="corner-art" aria-hidden="true">
    <div class="corner-piece tl"></div>
    <div class="corner-piece tr"></div>
    <div class="corner-piece bl"></div>
    <div class="corner-piece br"></div>
  </div>
  <!-- Bottom-right corner mark, painted INTO the ink-wash scene (style.css).
       Two jobs in one line of chrome. It is the standing link to the privacy
       policy — until now reachable only from About, one level down. And it is
       the app's NAME on its own home page: Google's OAuth consent screen checks
       that the name shown while signing in appears here, and a board rendered
       entirely by JS carries that name nowhere a fetch can find it.
       BOTH STRINGS ARE IN THE MARKUP rather than filled in by the bundle, for
       that same reason — a fetch that never runs the JS still finds them.
       initCornerMark (js/ui.js) swaps the label to the active language at boot,
       so the English here is a seed, not the final text. -->
  <div id="corner-mark">
    <span id="corner-brand">Only Move</span>
    <a id="corner-privacy" href="privacy.html" target="_blank" rel="noopener">Privacy policy</a>
  </div>

  <!-- New main container for Flexbox layout -->
  <div id="main-container">
    <div id="title-container">
      <div id="title" class="info-text"></div>
      <div id="captures-container" class="captures-container">
        <div id="capture-score" class="capture-score" role="button" tabindex="0"></div>
      </div>
      <div id="text1-slot" class="info-slot">
        <span id="text1-label" class="info-label"></span>
        <div id="text1" class="info-text"></div>
      </div>
      <a href="#" id="menu-toggle" class="menu-toggle" role="button" tabindex="0" aria-label="Menu">☰</a>
    </div>

    <div id="board-container"></div>

    <!-- Keyboard coordinate entry (accessibility): permanently invisible;
         type e.g. C3 and press Enter from anywhere. See js/coord-input.js. -->
    <input id="coord-input" type="text" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false">

    <!-- New wrapper for control panels -->
    <div id="controls-wrapper">
      <div id="info-container">
        <div id="title-h" class="info-text horizontal-only"></div>
        <div id="captures-container-h" class="captures-container horizontal-only">
          <div id="capture-score-h" class="capture-score" role="button" tabindex="0"></div>
        </div>
        <div id="text1-h-slot" class="info-slot horizontal-only">
          <span id="text1-h-label" class="info-label"></span>
          <div id="text1-h" class="info-text"></div>
        </div>
        <a href="#" id="menu-toggle-h" class="btn horizontal-only" role="button" tabindex="0">Menu</a>
        <a href="#" id="button1" class="btn"></a>
        <a href="#" id="button2" class="btn"></a>
        <a href="#" id="button4" class="btn"></a>
        <!-- Recall (challenge mode) and Share (review mode) trade places in the
             last button slot; exactly one is shown at a time, so button
             positions don't jump when switching modes. The recall badge counts
             the problems currently due (ui.js). -->
        <a href="#" id="button-recall" class="btn" role="button" tabindex="0">
          <span id="button-recall-label"></span>
          <span id="button-recall-count" class="btn-badge" hidden></span>
        </a>
        <a href="#" id="button-share" class="btn" role="button" tabindex="0"></a>
        <!-- Review-mode "why this move" bubble. In landscape it's a plain
             in-flow block below the buttons (always fully visible, exactly
             the buttons' width); in portrait it's a position:fixed overlay
             parked below the controls whose tab lifts it over the board
             (see style.css + motif-bubble.js). -->
        <div id="motif-bubble" class="motif-bubble motif-bubble-hidden" aria-hidden="true">
          <div id="motif-bubble-content" class="motif-bubble-content"></div>
          <button id="motif-bubble-tab" class="motif-bubble-tab" type="button">
            <span id="motif-bubble-tab-label" class="motif-bubble-tab-label"></span>
          </button>
        </div>
      </div>
    </div>

    <!-- Hamburger-driven menu, grouped into categories. Category labels and
         per-item / per-group visibility are set context-dependently in ui.js
         (updateMenuItems): Practice, Community and More are always shown; the
         Review group only appears in analysis mode. Community holds the two
         standalone Worker pages and the Discord invite; the Statistics link's
         fragment is written at click time (main.js). -->
    <div id="menu-overlay" class="menu-overlay menu-overlay-hidden">
      <div id="menu-panel">
        <div class="menu-category">
          <div class="menu-category-label" id="menu-cat-practice"></div>
          <a href="#" id="menu-board-size" class="menu-item btn" role="button" tabindex="0"></a>
          <a href="#" id="menu-pause-recalls" class="menu-item btn" role="button" tabindex="0"></a>
          <a href="#" id="menu-audio" class="menu-item btn" role="button" tabindex="0"></a>
        </div>
        <div class="menu-category" id="menu-group-review">
          <div class="menu-category-label" id="menu-cat-review"></div>
          <a href="#" id="menu-ignore" class="menu-item btn" role="button" tabindex="0"></a>
        </div>
        <div class="menu-category">
          <div class="menu-category-label" id="menu-cat-community"></div>
          <a href="/leaderboard" id="menu-leaderboard" class="menu-item btn" target="_blank" rel="noopener"></a>
          <a href="/statistics" id="menu-statistics" class="menu-item btn" target="_blank" rel="noopener"></a>
          <a href="https://discord.gg/ZU7jJNnkbB" id="menu-discord" class="menu-item btn" target="_blank" rel="noopener"></a>
        </div>
        <div class="menu-category">
          <div class="menu-category-label" id="menu-cat-more"></div>
          <a href="#" id="menu-stats" class="menu-item btn" role="button" tabindex="0"></a>
          <a href="#" id="menu-account" class="menu-item btn" role="button" tabindex="0"></a>
          <a href="about.html" id="menu-about" class="menu-item btn" target="_blank" rel="noopener"></a>
        </div>
      </div>
    </div>

  </div>

  <script type="text/javascript">
    var WGo = WGo || {};
    WGo.DIR = 'lib/wgo/';
  </script>

  <script type="text/javascript" src="lib/wgo/wgo.min.js"></script>
  <!-- NOT dead code: despite the "player" name this defines WGo.Kifu /
       WGo.KifuReader (SGF parsing), which board.js/sgf.js depend on. -->
  <script type="text/javascript" src="lib/wgo/wgo.player.min.js"></script>
  <script type="text/javascript" src="lib/jszip.min.js"></script>
  <script type="module" src="js/main.js"></script>
  <script>
    // Safety net: if the JS bundle fails to load/parse entirely, main.js's
    // hideBootSplash() never runs. Drop the splash after 15s so a catastrophic
    // failure degrades to the (blank-header) static UI instead of an eternal
    // spinner. It guards the BUNDLE, not the boot: main.js clears this timer
    // the moment it runs, so a slow first load (a throttled network fetching
    // the problem archive) keeps the splash up until the board is ready
    // rather than dropping it onto the half-built shell at the 15s mark.
    window.__bootSplashTimer = setTimeout(function () {
      var el = document.getElementById('boot-splash');
      if (el) el.classList.add('boot-hidden');
    }, 15000);
  </script>
  <script>
    // Register Service Worker — skipped in local dev so wrangler rebuilds
    // aren't masked by SW cache-first asset serving. Any SW left over from a
    // previous dev session is actively unregistered to make the next refresh
    // a pure network fetch.
    const isLocalDev = ['localhost', '127.0.0.1', '0.0.0.0'].includes(location.hostname);
    if ('serviceWorker' in navigator && isLocalDev) {
        navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
    }
    if ('serviceWorker' in navigator && !isLocalDev) {
        // If the page already has a controller, any future controllerchange
        // means a new SW took over — reload once so the page picks up the
        // new hashed bundles before the old ones disappear from the server.
        if (navigator.serviceWorker.controller) {
            let reloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (reloading) return;
                reloading = true;
                window.location.reload();
            });
        }
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then(registration => {
            }).catch(err => {
                console.error('Service Worker registration failed:', err);
            });
        });
    }
  </script>
</body>
</html>
