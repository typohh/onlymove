<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Yose Tsumego">
    <link rel="manifest" href="/manifest.json">
    <title>Yose Tsumego</title>
    <link rel="stylesheet" type="text/css" href="wgo.js/wgo/wgo.player.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrollbars */
            height: 100vh;
            background-color: #f0f0f0; /* Light gray background */
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Dark mode */
        @media (prefers-color-scheme: dark) {
            html, body {
                background-color: #121212; /* Dark background */
                color: #ffffff; /* Light text */
            }
        }

        #app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #board-container {
            position: relative;
        }
        #info-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            font-weight: bold;
        }
        #komi {
            flex-grow: 1;
            text-align: center;
        }
        #prev-tsumego {
            text-decoration: underline;
            color: #0066cc;
            cursor: pointer;
        }
        #prev-tsumego.disabled {
            color: #999999;
            cursor: not-allowed;
            text-decoration: none;
        }
        .wgo-board {
            border: none !important;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <div id="board-container"></div>
        <div id="info-container">
            <a id="prev-tsumego" href="#" style="text-decoration: none; color: inherit;">Previous Tsumego</a>
            <div id="komi">7.5 komi</div>
            <div id="rank-display">Loading...</div>
        </div>
    </div>

    <script type="text/javascript" src="wgo.js/wgo/wgo.js"></script>
    
    <script type="text/javascript" src="wgo.js/wgo/sgfparser.js"></script>
    <script type="text/javascript" src="wgo.js/wgo/kifu.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>
