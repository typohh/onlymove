<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <title>Yose Tsumego</title>
    <link rel="stylesheet" type="text/css" href="wgo.js/wgo/wgo.player.css" />
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #board-container {
            width: 400px;
            height: 400px;
        }

        #controls {
            margin-top: 20px;
        }

        #rank-controls {
            margin-top: 10px;
        }

        #rank-controls button {
            margin: 2px;
            padding: 5px 10px;
        }

        @media (orientation: landscape) {
            body {
                flex-direction: row;
                align-items: flex-start;
            }

            #controls {
                margin-top: 0;
                margin-left: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="board-container"></div>
    <div id="controls">
        <div id="stats">
            <p>Rank: <span id="rank">N/A</span></p>
        </div>
        
    </div>

    <script type="text/javascript" src="wgo.js/wgo/wgo.js"></script>
    
    <script type="text/javascript" src="wgo.js/wgo/sgfparser.js"></script>
    <script type="text/javascript" src="wgo.js/wgo/kifu.js"></script>
    <script type="text/javascript" src="wgo.js/extensions/tsumego/tsumego.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>
