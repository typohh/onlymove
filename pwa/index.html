<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <title>Yose Tsumego</title>
    <link rel="stylesheet" type="text/css" href="wgo.js/wgo/wgo.player.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 0;
        }

        #board-container {
            width: 100vw;
            height: 100vw;
            max-width: none;
            max-height: none;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Remove borders from wgo board to eliminate 1px gap at top */
        .wgo-board {
            margin: 0 !important;
            border-top: none !important;
            border-right: none !important;
            border-left: none !important;
            border-bottom: none !important;
        }

        #controls {
            margin-top: 20px;
        }

        #rank-controls {
            margin-top: 10px;
        }

        #rank-controls button {
            margin: 2px;
            padding: 5px 10px;
        }

        @media (orientation: landscape) {
            body {
                flex-direction: row;
                align-items: flex-start;
            }

            #board-container {
                width: 90vh;
                height: 90vh;
                max-width: 90vh;
                max-height: 90vh;
            }

            #controls {
                margin-top: 0;
                margin-left: 20px;
            }
        }

        @media (max-width: 400px) {
            #board-container {
                width: 100vw;
                height: 100vw;
            }
        }

        /* Ensure board takes full width on vertical screens */
        @media (orientation: portrait) {
            #board-container {
                width: 100vw;
                height: 100vw;
                max-width: 100vw;
                max-height: 100vw;
            }
        }
    </style>
</head>
<body>
    <div id="board-container"></div>
    <div id="controls">
        <div id="stats">
            <p>Rank: <span id="rank">N/A</span></p>
        </div>
        
    </div>

    <script type="text/javascript" src="wgo.js/wgo/wgo.js"></script>
    
    <script type="text/javascript" src="wgo.js/wgo/sgfparser.js"></script>
    <script type="text/javascript" src="wgo.js/wgo/kifu.js"></script>
    <script src="app56154069.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>
