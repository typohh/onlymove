name = "onlymove"
compatibility_date = "2023-12-01"
# @block65/webcrypto-web-push imports `node:crypto` in one isomorphic
# fallback path; nodejs_compat lets Workers polyfill it cleanly.
compatibility_flags = ["nodejs_compat"]
main = "src/index.js"

routes = [
    { pattern = "onlymove.net", custom_domain = true },
    { pattern = "www.onlymove.net", custom_domain = true }
]

[assets]
directory = "dist"
binding = "ASSETS"
# `none` disables the default trailing-slash redirect so /9 and /13 don't
# 307 to / before the SPA fallback can run.
html_handling = "none"
# Anything that doesn't map to a real file (including `/`, `/9`, `/13`)
# falls back to index.html with the original URL preserved, so JS can read
# the size hint from window.location.pathname.
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "tsumego-reports"
database_id = "1ad806c8-464d-44be-9cf0-134ebca8d4ac"

# Hourly cron for the recall-notification scheduler. See the `scheduled`
# handler in src/index.js.
[triggers]
crons = ["0 * * * *"]

# VAPID identity for Web Push. The private key is a wrangler secret:
#   wrangler secret put VAPID_PRIVATE_KEY
# Public key is non-secret (clients fetch it via GET /push/vapid-public-key).
[vars]
VAPID_SUBJECT = "mailto:typo.hh@gmail.com"
VAPID_PUBLIC_KEY = "BJNAIIOg6WUBjq4Yj3DVSHDannFBUlcTKC4RL3XzNVX5y5dR4iGnx_EgKAW0eLm0GfCD9cTpQn0VxfS53ANDRpQ"

# --- Per-IP rate limiting (abuse / D1-quota defense) -------------------------
# Native Workers rate-limiting bindings, enforced in src/index.js BEFORE any D1
# write, so a flood costs only a cheap Worker invocation instead of D1 write
# quota (a spoofed INSERT also keeps costing read quota: it inflates every
# server-stats `created_at >= ?` window scan for 7 days). Period must be 10 or
# 60 seconds.
#
# Limits are sized from the production attempts dump: the heaviest legitimate
# power user produced ~24 reports in any 60s window (review re-reports included;
# p99.9 across all users = 20, p99 = 17). RL_REPORT at 100/60s leaves ~4x
# headroom over that ceiling for several users sharing one NAT'd IP, while a
# scripted flood (thousands/min) is rejected. The low-frequency write endpoints
# (schedule/rank-survey/share-event/push subscribe) share the tighter RL_WRITE,
# as does /sync (a read, but per-user-keyed and D1-rows-read-relevant).
[[unsafe.bindings]]
name = "RL_REPORT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

# 50/60s: sized for the worst legitimate burst — a dormant returner's backfill
# day runs a full /sync reconcile pull (~11 pages for the heaviest user) plus
# ~18 /report-backfill batches back-to-back ≈ 29 sequential requests, which sat
# right at the old 30/60s line. Still a trivial threshold against a flood.
[[unsafe.bindings]]
name = "RL_WRITE"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 50, period = 60 }

# OUTER edge layer: a Cloudflare dashboard WAF *rate-limiting rule* (Security →
# WAF → Rate limiting rules). It is account config, not in this repo, so apply
# it manually. Blocked requests never invoke the Worker (zero Worker + D1 cost),
# so this is the cheapest layer and absorbs the worst bursts. This rule is
# CURRENTLY IN EFFECT (deployed; last updated 2026-05-30) — not aspirational:
#   Description: "Flood guard on write endpoints (POST)"   Action: Block
#   When incoming requests match:  (http.request.method eq "POST")
#   Counting characteristic: ip.src   Period: 10s   Requests: 100
#   Mitigation timeout: 10s
# It matches ALL POSTs by METHOD alone (no path list), so every write endpoint —
# /report, /sync, /schedule, /rank-survey, /share-event, /push/*, /register, and
# any future POST route — is covered automatically; there is nothing to add per
# endpoint. 100/10s is well above any legitimate burst (the heaviest real user
# hit ~24 reports in a 60s window, far under 100 in any 10s), yet a scripted
# flood is dropped at the edge before it reaches the Worker.
#
# fetch_database is NOT affected: `wrangler d1 export` (pipeline.fetch_database)
# hits api.cloudflare.com with an API token, a different hostname than the
# onlymove.net zone these rules guard, and the rule is scoped to the write paths
# anyway — not the D1 export API.
